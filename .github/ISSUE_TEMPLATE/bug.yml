name: Bug in the server or the Server Manager
description: The server or the manager crashes, a report is wrong, or the server behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, the full error message and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "output of: git rev-parse --short HEAD"
  - type: input
    id: system
    attributes:
      label: Manager version and Windows version
      placeholder: "Server Manager 1.0.0, Windows 11"
