name: C# server (Sanctuary.Ps3)

# Builds and tests the C# port in src/ps3. The tests compare the C# code with answers recorded from the Python
# reference (tools/gen_ps3_vectors.py), so the two implementations cannot drift apart unnoticed.

on:
  push:
    branches: [main]
    paths:
      - "src/ps3/**"
      - "bootstrap/**"
      - "tools/gen_ps3_vectors.py"
      - "tools/gen_ps3_web_vectors.py"
      - "tools/gen_ps3_gateway_vectors.py"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "src/ps3/**"
      - "bootstrap/**"
      - "tools/gen_ps3_vectors.py"
      - "tools/gen_ps3_web_vectors.py"
      - "tools/gen_ps3_gateway_vectors.py"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ps3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/ps3/global.json
          # The projects target net9.0 like the Sanctuary solution, so the 9.0 runtime must be there as well.
          dotnet-version: |
            9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reference vectors are up to date
        working-directory: .
        run: |
          python tools/gen_ps3_vectors.py --check
          python tools/gen_ps3_web_vectors.py --check
          python tools/gen_ps3_gateway_vectors.py --check

      - name: Restore
        run: dotnet restore Sanctuary.Ps3.slnx

      # Job logs are not always readable from outside, so compiler errors are repeated as annotations.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Sanctuary.Ps3.slnx --no-restore -nologo -clp:NoSummary 2>&1 | tee build.log || status=$?
          if [ "${status:-0}" != "0" ]; then
            errors=$(grep -E ': error ' build.log | sort -u | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
            echo "::error title=dotnet build failed::${errors}"
            exit 1
          fi
          warnings=$(grep -E ': warning ' build.log | sort -u | head -20 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
          if [ -n "$warnings" ]; then echo "::warning title=dotnet build warnings::${warnings}"; fi

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build --nologo --logger "console;verbosity=normal" 2>&1 | tee test.log || status=$?
          summary=$(grep -E 'Passed!|Failed!|Total tests|Failed |Error Message|Assert\.|Expected|Actual|\[FAIL\]' test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
          if [ "${status:-0}" != "0" ]; then
            echo "::error title=dotnet test failed::${summary}"
            exit 1
          fi
          echo "::notice title=dotnet test::${summary}"

      # The console program itself: argument errors, start-up, an answer over HTTP, and a clean stop.
      - name: Console program smoke test
        shell: bash
        run: |
          set -u
          dll=$(ls Sanctuary.Ps3.Server/bin/*/*/Sanctuary.Ps3.Server.dll | head -1)
          client=$(mktemp -d)/client
          mkdir -p "$client/USRDIR/Digests"
          python3 - "$client/USRDIR/Digests/NPUA30048.soe" <<'PY'
          import sys, zlib
          open(sys.argv[1], "wb").write(zlib.compress(b"digest body " * 20, 9) + bytes(129))
          PY

          dotnet "$dll" --help | head -1 | grep -q '^usage:' || { echo "::error::--help did not print the usage"; exit 1; }

          set +e
          dotnet "$dll" --bogus >/dev/null 2>err.txt; code=$?
          set -e
          [ "$code" = 2 ] || { echo "::error::a wrong option should exit with 2, got $code"; exit 1; }

          export FR_TRACE_DIR=$(mktemp -d)
          dotnet "$dll" --client "$client" --no-dns --port 18080 --gateway-port 18081 > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/app/appconfig.php -o appconfig.xml && break; sleep 1; done
          status=0
          grep -q '<AppConfig>' appconfig.xml || status=1
          curl -sf http://127.0.0.1:18080/patch/freerealms/ps3scelive/ps3-web/FreeRealms.soe -o digest.bin || status=1
          [ "$(stat -c %s digest.bin)" -gt 129 ] || status=1
          kill -TERM $pid
          wait $pid; code=$?
          echo "server exit code $code"
          log=$(sed 's/%/%25/g' server.log | awk 'BEGIN{ORS="%0A"} {print}')
          if [ "$status" != 0 ] || [ "$code" != 0 ]; then echo "::error title=console smoke test failed (exit $code)::$log"; exit 1; fi
          grep -q 'HTTP listening on 127.0.0.1:18080' server.log || { echo "::error title=no start-up line::$log"; exit 1; }
          echo "::notice title=console smoke test::$log"
