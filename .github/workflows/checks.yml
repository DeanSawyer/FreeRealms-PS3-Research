name: Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game files are tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.(self|elf|pack|zs|soe|sprx|prx|pkg|edat|rap|rif|sdat|bin|gcnk|gzne|cob|odd)$|^NPUA30048/|EBOOT\.BIN' || true)
          if [ -n "$bad" ]; then echo "Game files are tracked:"; echo "$bad"; exit 1; fi
      - name: The repository is C# only
        run: |
          bad=$(git ls-files | grep -Ei '\.py$' || true)
          if [ -n "$bad" ]; then echo "::error::Python files are tracked (the Python tools live on the python-archive branch):"; echo "$bad"; exit 1; fi
