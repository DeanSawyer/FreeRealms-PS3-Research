name: Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  python-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q bootstrap tools
      - name: Documentation links and referenced paths
        run: python tools/check_docs.py
      - name: No game files are tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.(self|elf|pack|zs|soe|sprx|prx|pkg|edat|rap|rif|sdat|bin|gcnk|gzne|cob|odd)$|^NPUA30048/|EBOOT\.BIN' || true)
          if [ -n "$bad" ]; then echo "Game files are tracked:"; echo "$bad"; exit 1; fi
