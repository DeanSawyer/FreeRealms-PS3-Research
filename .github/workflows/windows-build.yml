name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained app
        run: dotnet publish src/FreeRealms.Bootstrap/FreeRealms.Bootstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\FreeRealmsBootstrap.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: FreeRealmsPS3Bootstrap-Windows-Setup
          path: dist/FreeRealmsPS3Bootstrap-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist/FreeRealmsPS3Bootstrap-Setup.exe" --title "Bootstrap Manager ${{ github.ref_name }}" --notes "Windows installer for the experimental C# bootstrap manager." --verify-tag
