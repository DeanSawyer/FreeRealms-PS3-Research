  "Free Realms PS3 game log to TTY":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.3
    Notes: "Writes every message the game logs to the TTY with sys_tty_write, formatted with the game's own vsnprintf (0xa30ff8), so the game's errors (\"Failed to serialize ...\") show in RPCS3's TTY.log with their values. Also writes each Marketplace and coin store script event the game raises (0x87c14, 0x133038) as \"Script event Handler.Event\", and the game's debug output (0xc7134) as \"Debug: ...\" (the store lists' jobs and row counts). The code is in the zero padding at 0xe86e40-0xe87090."
