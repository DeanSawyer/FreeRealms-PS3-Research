  "Free Realms PS3 keyboard close fix":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.0
    Notes: "The game's general keyboard handler closed the on-screen keyboard before character creation could read the custom name, so creation waited forever. It now closes the keyboard only when it opened it (chat)."
