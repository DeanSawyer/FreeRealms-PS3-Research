  "Free Realms PS3 game log to TTY":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.5
    Notes: "Writes every message the game logs to the TTY with sys_tty_write, formatted with the game's own vsnprintf (0xa30ff8), so the game's errors (\"Failed to serialize ...\") show in RPCS3's TTY.log with their values. Also writes each script handler event the game raises (0x133038) as \"Script event Handler.Event\". The code is in the zero padding at 0xe86e40-0xe86f78 (the rest, to 0xe87014, is the character wheel's)."
