Version: 1.2

# Game fixes for Free Realms (NPUA30048 1.77, the decrypted game.elf) that the PS3 server needs. The server manager adds them to
# RPCS3's patches\imported_patch.yml and turns them on before a test run; to add them by hand, drag this file into RPCS3's
# Manage > Game Patches window and tick both. Why each is needed: docs/rpcs3/patches.md.

PPU-5425f6d47ba410afbcbc7ce77f87f2ffcde68798:
  "Free Realms PS3 keyboard close fix":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.0
    Notes: "The game's general keyboard handler closed the on-screen keyboard before character creation could read the custom name, so creation waited forever. It now closes the keyboard only when it opened it (chat)."
