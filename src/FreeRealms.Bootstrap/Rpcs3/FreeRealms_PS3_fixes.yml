  "Free Realms PS3 marketplace without PSN":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.0
    Notes: "The PS3 Marketplace waits for its PSN store data (sceNpCommerce2, which fails without PSN) before it reports ready; until then the store screen shows nothing. When fetching it fails, the commerce processor now reports ready=true instead of false (0x42aed8), so the store opens on the server's data."
    Patch:
      - [ be32, 0x0042aed8, 0x38800001 ]
