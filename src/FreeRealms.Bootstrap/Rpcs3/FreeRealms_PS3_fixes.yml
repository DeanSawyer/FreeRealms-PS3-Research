  "Free Realms PS3 character wheel":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 3.1
    Notes: "Character select for several characters, with the select panel (the Server Manager's Characters page puts the PC client's panel in place of the select prompt and fills it with the characters). D-pad right turns the game's character list one step per press (the D-pad values are held states, so the last ones are kept in 4516/4520 as the creator does); left does nothing. Each turn sends \"CharacterCreatePopups:DisplayText\" with no text, which the panel takes as one step, so it follows the list, and writes \"wheel turn <steps>\" to the game log. The 3D preview is not rebuilt (rebuilding it crashed). X plays the first character of the list, or opens the creator on the server's New character entry (guid 0x7FFF0000). Triangle opens the game's own delete prompt (state 12: X deletes the first character of the list, Circle goes back) for a saved character. The popups window (the panel) goes to the left of the screen: Window:SetPosition (0x21b8b8) puts a 550-wide window at y 75 at x = 40 instead of centred. The select preview stands 3.8 back along x (-x takes it right and away from the camera, to stand over the Welcome to Free Realms logo) (state 9, 0x78f6fc: the position at 0x1080e70+384 before 0x836f48 sets it). It also turns by -0.22 radians about y (0x78f728: the Euler angles at 0x1080e70+368 before 0x836c94 sets them) to face the camera. The code is in the select prompt's old delete path (0x791b94-0x791c14) and the zero padding at 0xe86f80-0xe86ffc and 0xe87014-0xe8710c."
    Patch:
      - [ be32, 0x0021b8b8, 0x48c6b789 ]
      - [ be32, 0x0078f6fc, 0x486f7961 ]
      - [ be32, 0x0078f728, 0x486f7955 ]
