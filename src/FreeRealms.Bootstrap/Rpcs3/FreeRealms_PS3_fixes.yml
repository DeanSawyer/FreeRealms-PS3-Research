  "Free Realms PS3 game log to TTY":
    Games:
      All:
        All: [ All ]
    Author: "DeanSawyer"
    Patch Version: 1.1
    Notes: "Writes the text of every message the game logs to the TTY with sys_tty_write, so the game's own errors (\"Failed to serialize ...\") show in RPCS3's TTY.log; a message that is only %s (script errors) prints its text. Hooks the log routine 0x163a8; the code is in the zero padding at 0xe86e40-0xe86f14."
